<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>たちいち｜2軸で立ち位置を投票する</title>
<style>
  :root {
    --paper: #FBFCFA;
    --ink: #1D2B36;
    --sub: #5C6B75;
    --line: #C9D3D6;
    --dot: #1F8A84;
    --mine: #E4572E;
    --panel: #EEF3F2;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "Hiragino Sans", "BIZ UDPGothic", "Yu Gothic", "Noto Sans JP", sans-serif;
    line-height: 1.7;
  }
  main { max-width: 560px; margin: 0 auto; padding: 20px 16px 48px; }
  body.host main { max-width: 1400px; }
  h1 { font-size: 1.35rem; line-height: 1.4; margin: 0 0 12px; font-weight: 700; }
  body.host h1 { font-size: 1.9rem; text-align: center; }
  p { margin: 0 0 12px; }
  .sub { color: var(--sub); font-size: .9rem; }

  #map { width: 100%; height: auto; display: block; background: #fff; border: 2px solid var(--ink); border-radius: 6px; }
  #map .axis { stroke: var(--ink); stroke-width: 1.5; }
  #map .lab { font-size: 13px; font-weight: 700; fill: var(--ink); paint-order: stroke; stroke: #fff; stroke-width: 4px; }
  #map .qn { font-size: 44px; font-weight: 700; fill: var(--ink); opacity: .1; text-anchor: middle; dominant-baseline: central; }
  #map .v { fill: var(--dot); opacity: .55; }
  #map .me { fill: var(--mine); stroke: #fff; stroke-width: 2; }
  #map .nm { font-size: 11px; font-weight: 700; fill: var(--ink); paint-order: stroke; stroke: #fff; stroke-width: 3px; dominant-baseline: central; }
  #map .nm.mine { fill: var(--mine); }
  /* 名前を隠しているときは、点にマウスを乗せるかタップした点の名前だけを出す */
  #map.hide-names .nm { display: none; }
  #map.hide-names .pt:hover .nm, #map.hide-names .pt.open .nm { display: inline; }
  #map.hide-names .pt { cursor: pointer; }
  /* ヒートマップ表示：点は薄くして、濃淡を主役にする */
  #map .heat { fill: var(--dot); }
  #map.heat .v { opacity: .3; }
  #heat-legend { display: flex; align-items: center; gap: 6px; font-size: .85rem; color: var(--sub); margin: 0 0 8px; }
  #heat-legend i { display: inline-block; width: 22px; height: 12px; background: var(--dot); border-radius: 2px; }
  #map .guide { stroke: var(--mine); stroke-width: 1.5; stroke-dasharray: 4 4; opacity: .6; }
  /* 位置を選んでいる間は、マップ上でスクロールや拡大が起きないようにする */
  body.picking #map { touch-action: none; user-select: none; -webkit-user-select: none; cursor: crosshair; }

  .panel { background: var(--panel); border-radius: 6px; padding: 16px; margin-top: 16px; }
  #name-box { margin-bottom: 12px; }
  #name-box label { margin-top: 0; }
  #pos { margin: 8px 0 0; font-weight: 700; font-size: 1.05rem; min-height: 1.7em; }
  /* 投票ボタンは画面下に固定して、スクロールしなくても押せるようにする */
  #vote-bar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
    padding: 8px 16px calc(12px + env(safe-area-inset-bottom));
    background: var(--paper); border-top: 1px solid var(--line);
  }
  #vote-bar > * { max-width: 528px; margin-left: auto; margin-right: auto; }
  #vote-bar #msg { margin-top: 0; min-height: 0; }
  body.picking main { padding-bottom: 140px; }

  label { display: block; font-weight: 700; font-size: .9rem; margin-top: 12px; }
  input[type=text] {
    width: 100%; padding: 10px 12px; font: inherit; color: inherit;
    border: 1.5px solid var(--line); border-radius: 6px; background: #fff;
  }
  label.check { display: flex; align-items: center; gap: 8px; margin-top: 20px; font-size: 1rem; cursor: pointer; }
  label.check input { width: 20px; height: 20px; margin: 0; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  fieldset { border: 0; padding: 0; margin: 16px 0 0; }
  legend { font-weight: 700; padding: 0; }

  button {
    font: inherit; font-weight: 700; min-height: 48px; padding: 10px 20px;
    border: 2px solid var(--ink); border-radius: 6px; background: var(--ink); color: #fff; cursor: pointer;
  }
  button.ghost { background: transparent; color: var(--ink); }
  button.wide { width: 100%; }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--mine); outline-offset: 2px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .url { flex: 1 1 240px; word-break: break-all; font-size: 1.05rem; font-weight: 700; }
  /* 進行役：横長の画面ではマップとQRコードを左右に、縦長の画面では上下に並べる */
  .stage { display: grid; gap: 24px; }
  body.host .stage-map { width: min(100%, 78vh); margin: 0 auto; }
  @media (min-width: 900px) and (min-aspect-ratio: 1/1) {
    body.host .stage { grid-template-columns: min(78vh, 60vw) minmax(260px, 1fr); justify-content: center; align-items: start; }
    body.host .stage-map { width: auto; margin: 0; }
  }
  #qr-box { background: var(--panel); border-radius: 6px; padding: 20px; text-align: center; }
  #qr-box .row { justify-content: center; }
  .qr-lead { font-weight: 700; font-size: 1.2rem; }
  #qr { display: block; width: min(100%, 420px); height: auto; margin: 0 auto 12px; background: #fff; }
  #qr-box.small #qr { width: 140px; }
  #qr-box.small .qr-lead { font-size: 1rem; }
  #msg { min-height: 1.7em; margin-top: 10px; font-weight: 700; color: var(--mine); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>

  <section id="v-setup" hidden>
    <h1>Firebaseの設定が必要です</h1>
    <p><code>config.example.js</code> を <code>config.js</code> という名前でコピーし、Firebaseコンソールで表示される設定値に書き換えてください。手順は <code>rules.md</code> にあります。</p>
  </section>

  <section id="v-create" hidden>
    <h1>たちいち</h1>
    <p class="sub">2つの軸を決めて、みんなの立ち位置を四象限に集めます。軸を決めると参加者用のURLが発行されます。</p>
    <label for="f-title">お題</label>
    <input type="text" id="f-title" maxlength="40" placeholder="例：これからの働き方">
    <fieldset>
      <legend>横の軸</legend>
      <div class="pair">
        <div><label for="f-xl">左</label><input type="text" id="f-xl" maxlength="12" placeholder="例：個人で"></div>
        <div><label for="f-xr">右</label><input type="text" id="f-xr" maxlength="12" placeholder="例：チームで"></div>
      </div>
    </fieldset>
    <fieldset>
      <legend>縦の軸</legend>
      <div class="pair">
        <div><label for="f-yb">下</label><input type="text" id="f-yb" maxlength="12" placeholder="例：安定"></div>
        <div><label for="f-yt">上</label><input type="text" id="f-yt" maxlength="12" placeholder="例：挑戦"></div>
      </div>
    </fieldset>
    <label class="check"><input type="checkbox" id="f-anon"> 名前なしの投票を許可する</label>
    <p style="margin-top:20px"><button class="wide" id="b-create">投票をつくる</button></p>
  </section>

  <section id="v-room" hidden>
    <h1 id="title"></h1>
    <div id="name-box" hidden>
      <label for="f-name" id="l-name">名前</label>
      <input type="text" id="f-name" maxlength="10" placeholder="例：わか" autocomplete="nickname">
    </div>
    <div class="stage">
    <div class="stage-map">
    <svg id="map" viewBox="0 0 400 400" role="img" aria-label="投票結果の四象限マップ">
      <g id="g-heat" shape-rendering="crispEdges"></g>
      <g id="g-count"></g>
      <line class="axis" x1="200" y1="10" x2="200" y2="390"/>
      <line class="axis" x1="10" y1="200" x2="390" y2="200"/>
      <g id="g-dots"></g>
      <text class="lab" id="l-xl" x="8" y="192" text-anchor="start"></text>
      <text class="lab" id="l-xr" x="392" y="192" text-anchor="end"></text>
      <text class="lab" id="l-yt" x="207" y="22" text-anchor="start"></text>
      <text class="lab" id="l-yb" x="207" y="390" text-anchor="start"></text>
    </svg>
    <p id="pos" aria-live="polite" hidden></p>
    <p class="sub" id="count" style="margin-top:8px"></p>
    <p id="heat-legend" hidden>少ない <span id="heat-steps"></span> 多い</p>
    <div class="row" id="view-bar" hidden>
      <button class="ghost" id="b-heat" aria-pressed="false">ヒートマップで見る</button>
      <button class="ghost" id="b-names" aria-pressed="true">名前を表示する</button>
    </div>
    </div>

    <aside id="qr-box" hidden>
      <p class="qr-lead">スマートフォンで読み取って参加</p>
      <svg id="qr" role="img" aria-label="参加用URLのQRコード"></svg>
      <p class="url" id="share-url"></p>
      <div class="row">
        <button class="ghost" id="b-share" hidden>URLを共有</button>
        <button class="ghost" id="b-copy">URLをコピー</button>
        <button class="ghost" id="b-qr-size"></button>
      </div>
    </aside>
    </div>

    <div id="vote-bar" hidden>
      <button class="wide" id="b-vote">投票する</button>
    </div>

    <div class="panel" id="host-panel" hidden>
      <p style="margin:0" class="row">
        <button id="b-reveal">結果を表示する</button>
        <button class="ghost" id="b-png" hidden>画像で保存</button>
        <button class="ghost" id="b-reset">投票をすべて消す</button>
      </p>
    </div>
  </section>

  <p id="msg" role="status"></p>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, get, set, push, update, onValue }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const $ = (id) => document.getElementById(id);
const show = (id) => { $(id).hidden = false; };
const say = (text) => { $("msg").textContent = text; };
const SVG = "http://www.w3.org/2000/svg";

const params = new URLSearchParams(location.search);
const room = (params.get("room") || "").replace(/[^A-Za-z0-9]/g, "");
const isHost = params.get("view") === "host";

// 設定値は config.js から読み込む（ファイルがなくても設定画面を出せるよう動的に読む）
let firebaseConfig = null;
try {
  ({ firebaseConfig } = await import("./config.js"));
} catch (e) {}

if (!firebaseConfig || !firebaseConfig.apiKey || firebaseConfig.apiKey.startsWith("YOUR")) {
  show("v-setup");
} else {
  const db = getDatabase(initializeApp(firebaseConfig));
  if (room) openRoom(db); else openCreate(db);
}

/* ---------- 投票をつくる ---------- */
function openCreate(db) {
  show("v-create");
  $("b-create").addEventListener("click", async () => {
    const meta = {};
    for (const k of ["title", "xl", "xr", "yb", "yt"]) {
      meta[k] = $("f-" + k).value.trim();
      if (!meta[k]) { say("すべての欄を入力してください"); $("f-" + k).focus(); return; }
    }
    if ($("f-anon").checked) meta.anon = true;
    const id = newRoomId();
    try {
      await set(ref(db, `rooms/${id}/meta`), meta);
      location.href = `${location.pathname}?room=${id}&view=host`;
    } catch (e) {
      say("投票をつくれませんでした。通信状況とFirebaseの設定を確認してください");
    }
  });
}

function newRoomId() {
  const chars = "abcdefghjkmnpqrstuvwxyz23456789";
  const bytes = crypto.getRandomValues(new Uint8Array(8));
  return Array.from(bytes, (b) => chars[b % chars.length]).join("");
}

/* ---------- 投票する・結果を見る ---------- */
async function openRoom(db) {
  let meta;
  try {
    meta = (await get(ref(db, `rooms/${room}/meta`))).val();
  } catch (e) {
    say("読み込めませんでした。通信状況を確認して、もう一度開いてください"); return;
  }
  if (!meta) { say("この投票は見つかりません。URLを確認してください"); return; }

  document.title = meta.title + "｜たちいち";
  $("title").textContent = meta.title;
  for (const k of ["xl", "xr", "yb", "yt"]) $("l-" + k).textContent = meta[k];
  show("v-room");

  const anon = meta.anon === true;     // 名前なしの投票を許可しているか
  const storeKey = "tachiichi-" + room;
  const nameKey = "tachiichi-name";
  let mine = loadMine(storeKey);       // { id, x, y } 自分の投票
  let votes = {};                      // 全員の投票
  let revealed = false;                // 進行役が結果を公開したか
  let pos = mine ? { x: mine.x, y: mine.y } : null; // マップで選んでいる位置
  let dragging = false;
  let qrSmall = false;                 // 結果の公開中はQRコードを小さくする
  let namesHidden = true;              // 結果で名前を隠しているか（この画面だけの設定。最初は隠す）
  let heat = false;                    // 結果をヒートマップで見ているか（この画面だけの設定）
  const votesRef = ref(db, `rooms/${room}/votes`);
  const stateRef = ref(db, `rooms/${room}/state`);

  if (isHost) {
    document.body.classList.add("host");
    show("host-panel"); show("qr-box");
    const url = `${location.origin}${location.pathname}?room=${room}`;
    $("share-url").textContent = url;
    drawQr(url);
    const copy = async () => {
      try { await navigator.clipboard.writeText(url); say("URLをコピーしました"); }
      catch (e) { say("コピーできませんでした。URLを長押しして選択してください"); }
    };
    $("b-copy").addEventListener("click", copy);
    // スマートフォンなど共有メニューがある環境では「URLを共有」を出す
    if (navigator.share) {
      show("b-share");
      $("b-share").addEventListener("click", async () => {
        try { await navigator.share({ title: meta.title + "｜たちいち", url }); }
        catch (e) { if (e.name !== "AbortError") copy(); }
      });
    }
    $("b-qr-size").addEventListener("click", () => { qrSmall = !qrSmall; render(); });
    $("b-reveal").addEventListener("click", async () => {
      if (!Object.values(votes).some(valid)) { say("まだ投票がありません"); return; }
      try { await set(stateRef, { revealed: true }); say(""); }
      catch (e) { say("結果を表示できませんでした。通信状況を確認してください"); }
    });
    $("b-png").addEventListener("click", async () => {
      const n = Object.values(votes).filter(valid).length;
      try {
        await savePng(meta.title, `${n}人の結果`, heat, `tachiichi-${fileName(meta.title)}.png`);
        say("");
      } catch (e) { say("画像を保存できませんでした。別のブラウザで試してください"); }
    });
    $("b-reset").addEventListener("click", async () => {
      const keys = Object.keys(votes);
      if (!keys.length && !revealed) { say("まだ投票がありません"); return; }
      if (!confirm(`${keys.length}件の投票をすべて消して、結果を隠します。元に戻せません。よろしいですか？`)) return;
      // 票の削除と非公開への切り替えを、まとめて1回で書き込む
      const changes = Object.fromEntries(keys.map((k) => [`votes/${k}`, null]));
      changes["state/revealed"] = null;
      try {
        await update(ref(db, `rooms/${room}`), changes);
        say("投票をすべて消しました");
      } catch (e) { say("消せませんでした。通信状況を確認してください"); }
    });
  } else {
    show("name-box"); show("pos"); show("vote-bar");
    $("vote-bar").prepend($("msg"));   // メッセージを投票ボタンのすぐ上に出す
    try { $("f-name").value = localStorage.getItem(nameKey) || ""; } catch (e) {}
    if (anon) $("l-name").textContent = "名前（入れなくても投票できます）";

    // マップをタップ（クリック）して点を置き、指を動かすと点もついてくる
    const map = $("map");
    const pick = (ev) => {
      const r = map.getBoundingClientRect();
      const vx = (ev.clientX - r.left) / r.width * 400;
      const vy = (ev.clientY - r.top) / r.height * 400;
      pos = { x: clamp(Math.round((vx - 200) / 1.8)), y: clamp(Math.round((200 - vy) / 1.8)) };
      render();
    };
    map.addEventListener("pointerdown", (ev) => {
      if (revealed) return;
      ev.preventDefault();
      dragging = true;
      map.setPointerCapture(ev.pointerId);
      pick(ev);
    });
    map.addEventListener("pointermove", (ev) => { if (dragging) pick(ev); });
    const stop = () => { if (dragging) { dragging = false; render(); } };
    map.addEventListener("pointerup", stop);
    map.addEventListener("pointercancel", stop);

    // キーボードでは矢印キーで動かす（Shiftで大きく）
    map.setAttribute("tabindex", "0");
    map.addEventListener("keydown", (ev) => {
      const d = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, 1], ArrowDown: [0, -1] }[ev.key];
      if (!d || revealed) return;
      ev.preventDefault();
      const step = ev.shiftKey ? 20 : 5;
      const p = pos || { x: 0, y: 0 };
      pos = { x: clamp(p.x + d[0] * step), y: clamp(p.y + d[1] * step) };
      render();
    });

    $("b-vote").addEventListener("click", async () => {
      const name = $("f-name").value.trim();
      if (!name && !anon) { say("名前を入力してください"); $("f-name").focus(); return; }
      if (!pos) { say("マップをタップして、あなたの位置を選んでください"); return; }
      const { x, y } = pos;
      const id = (mine && mine.id) || push(votesRef).key;
      try {
        await set(ref(db, `rooms/${room}/votes/${id}`), name ? { x, y, name } : { x, y });
        mine = { id, x, y };
        try {
          localStorage.setItem(storeKey, JSON.stringify(mine));
          if (name) localStorage.setItem(nameKey, name);
        } catch (e) {}
        say("投票しました。結果が表示されるまでは、投票し直すこともできます");
      } catch (e) {
        say(revealed ? "投票は締め切られました" : "投票を送れませんでした。通信状況を確認してください");
      }
    });
  }

  $("b-names").addEventListener("click", () => { namesHidden = !namesHidden; render(); });
  $("b-heat").addEventListener("click", () => { heat = !heat; render(); });
  $("heat-steps").replaceChildren(...HEAT_STEPS.map((o) => {
    const i = document.createElement("i");
    i.style.opacity = o;
    return i;
  }));
  // 名前を隠しているときは、タップした点の名前を出す（マウスがない端末向け）
  $("map").addEventListener("click", (ev) => {
    if (!revealed || !namesHidden) return;
    const pt = ev.target.closest(".pt");
    for (const g of $("g-dots").querySelectorAll(".pt.open")) if (g !== pt) g.classList.remove("open");
    if (pt) pt.classList.toggle("open");
  });

  onValue(votesRef, (snap) => { votes = snap.val() || {}; render(); },
    () => say("結果を読み込めませんでした。通信状況を確認してください"));
  onValue(stateRef, (snap) => {
    const next = !!(snap.val() && snap.val().revealed === true);
    if (next !== revealed) { say(""); qrSmall = next; }
    revealed = next;
    render();
  }, () => say("結果を読み込めませんでした。通信状況を確認してください"));

  function render() {
    const voted = !isHost && mine && votes[mine.id];
    const dots = $("g-dots"), counts = $("g-count");
    dots.replaceChildren(); counts.replaceChildren(); $("g-heat").replaceChildren();

    if (revealed) {
      if (heat) $("g-heat").append(...heatCells(Object.values(votes).filter(valid)));
      const q = [0, 0, 0, 0]; // 左上, 右上, 左下, 右下
      const myDot = [];
      for (const [id, v] of Object.entries(votes)) {
        if (!valid(v)) continue;
        if (v.x !== 0 && v.y !== 0) q[(v.y > 0 ? 0 : 2) + (v.x > 0 ? 1 : 0)]++;
        const isMine = !isHost && mine && id === mine.id;
        // 自分の点は最後に描いて、ほかの点に隠れないようにする
        if (isMine) myDot.push(dot(v.x, v.y, true, v.name));
        else dots.append(dot(v.x, v.y, false, v.name));
      }
      dots.append(...myDot);
      [[105, 105], [295, 105], [105, 295], [295, 295]].forEach(([cx, cy], i) => {
        const t = document.createElementNS(SVG, "text");
        t.setAttribute("class", "qn"); t.setAttribute("x", cx); t.setAttribute("y", cy);
        t.textContent = q[i];
        counts.append(t);
      });
    } else if (!isHost && pos) {
      // 公開前は自分が選んでいる位置だけ。動かしている間は軸までのガイド線を出す
      const cx = 200 + pos.x * 1.8, cy = 200 - pos.y * 1.8;
      if (dragging) dots.append(line(cx, cy, 200, cy), line(cx, cy, cx, 200));
      dots.append(dot(pos.x, pos.y, true));
    }

    const n = Object.values(votes).filter(valid).length;
    let text;
    if (revealed) text = `${n}人の結果です`;
    else if (isHost) text = `${n}人が投票しました。「結果を表示する」を押すと、みんなの位置が表示されます`;
    else if (voted) text = "投票しました。進行役が結果を表示するまでお待ちください";
    else if (anon) text = "マップで位置を選んでから「投票する」を押してください。名前は入れなくてもかまいません";
    else text = "名前を入れ、マップで位置を選んでから「投票する」を押してください";
    $("count").textContent = text;

    const hasNames = Object.values(votes).some((v) => valid(v) && typeof v.name === "string" && v.name);
    $("view-bar").hidden = !revealed;
    $("b-names").hidden = !hasNames;
    $("map").classList.toggle("hide-names", namesHidden);
    $("map").classList.toggle("heat", revealed && heat);
    $("heat-legend").hidden = !revealed || !heat;
    $("b-heat").textContent = heat ? "点で見る" : "ヒートマップで見る";
    $("b-heat").setAttribute("aria-pressed", String(heat));
    $("b-names").textContent = namesHidden ? "名前を表示する" : "名前を隠す";
    $("b-names").setAttribute("aria-pressed", String(namesHidden));

    if (isHost) {
      $("b-reveal").hidden = revealed;
      $("b-png").hidden = !revealed;
      $("qr-box").classList.toggle("small", qrSmall);
      $("b-qr-size").textContent = qrSmall ? "QRコードを大きく" : "QRコードを小さく";
      return;
    }

    document.body.classList.toggle("picking", !revealed);
    $("name-box").hidden = revealed;
    $("pos").hidden = revealed;
    $("vote-bar").hidden = revealed;
    $("pos").textContent = pos
      ? "あなたの位置：" + describe(pos, meta)
      : "マップをタップして、あなたの位置を選んでください";
    $("map").setAttribute("aria-label", revealed ? "投票結果の四象限マップ"
      : "あなたの位置を選ぶマップ。矢印キーでも動かせます。" + $("pos").textContent);
    const moved = voted && pos && (pos.x !== mine.x || pos.y !== mine.y);
    $("b-vote").textContent = !voted ? "投票する" : moved ? "この位置に投票し直す" : "投票済み（動かすと投票し直せます）";
  }
}

// 参加用URLのQRコードを描く（ライブラリは進行役の画面でだけ読み込む）
async function drawQr(url) {
  try {
    const { default: qrcode } = await import("https://cdn.jsdelivr.net/npm/qrcode-generator@2.0.4/dist/qrcode.mjs");
    const qr = qrcode(0, "M");
    qr.addData(url);
    qr.make();
    const n = qr.getModuleCount(), quiet = 4;
    let d = "";
    for (let r = 0; r < n; r++)
      for (let c = 0; c < n; c++)
        if (qr.isDark(r, c)) d += `M${c + quiet} ${r + quiet}h1v1h-1z`;
    const path = document.createElementNS(SVG, "path");
    path.setAttribute("d", d);
    path.setAttribute("fill", "#000");
    const svg = $("qr");
    svg.setAttribute("viewBox", `0 0 ${n + quiet * 2} ${n + quiet * 2}`);
    svg.setAttribute("shape-rendering", "crispEdges");
    svg.replaceChildren(path);
  } catch (e) {
    $("qr").hidden = true;
    say("QRコードを表示できませんでした。URLを共有するかコピーして伝えてください");
  }
}

  #map .qn { font-size: 44px; fill: #1D2B36; opacity: .1; text-anchor: middle; dominant-baseline: central; }
  #map .v { fill: #1F8A84; opacity: .55; }

// いま表示しているマップに、お題と人数を添えてPNGで保存する
async function savePng(title, foot, withLegend, name) {
  const W = 440, H = 500, scale = 3;
  const svg = document.createElementNS(SVG, "svg");
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.setAttribute("width", W * scale); svg.setAttribute("height", H * scale);
  const style = document.createElementNS(SVG, "style");
  style.textContent = EXPORT_CSS;
  const bg = document.createElementNS(SVG, "rect");
  bg.setAttribute("width", W); bg.setAttribute("height", H); bg.setAttribute("fill", "#FBFCFA");
  // 長いお題は文字を小さくして、横幅に収める
  const t = text(20, 36, title, "ttl");
  t.setAttribute("font-size", Math.min(20, 400 / title.length));
  // マップは白地と枠を敷いてから、画面のものを複製して置く
  const frame = document.createElementNS(SVG, "rect");
  frame.setAttribute("x", 20); frame.setAttribute("y", 56); frame.setAttribute("width", 400); frame.setAttribute("height", 400);
  frame.setAttribute("rx", 6); frame.setAttribute("fill", "#fff"); frame.setAttribute("stroke", "#1D2B36"); frame.setAttribute("stroke-width", 2);
  const map = $("map").cloneNode(true);
  for (const [k, v] of [["x", 20], ["y", 56], ["width", 400], ["height", 400]]) map.setAttribute(k, v);
  svg.append(style, bg, t, frame, map, text(20, 482, foot, "foot"));
  if (withLegend) {
    // 右端から「多い」、濃さの四角、「少ない」の順に並べる
    const right = 420, hiW = 24, gap = 4, step = 18;
    const boxEnd = right - hiW - gap, boxStart = boxEnd - HEAT_STEPS.length * step + 2;
    const lo = text(boxStart - gap, 482, "少ない", "foot");
    const hi = text(right, 482, "多い", "foot");
    lo.setAttribute("text-anchor", "end"); hi.setAttribute("text-anchor", "end");
    svg.append(lo, hi);
    HEAT_STEPS.forEach((o, i) => {
      const r = document.createElementNS(SVG, "rect");
      r.setAttribute("x", boxStart + i * step); r.setAttribute("y", 472);
      r.setAttribute("width", step - 2); r.setAttribute("height", 10); r.setAttribute("rx", 2);
      r.setAttribute("class", "lg"); r.setAttribute("fill-opacity", o);
      svg.append(r);
    });
  }

  const img = new Image();
  img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(new XMLSerializer().serializeToString(svg));
  await img.decode();
  const canvas = document.createElement("canvas");
  canvas.width = W * scale; canvas.height = H * scale;
  canvas.getContext("2d").drawImage(img, 0, 0);
  const blob = await new Promise((ok, ng) => canvas.toBlob((b) => b ? ok(b) : ng(new Error("toBlob")), "image/png"));
  download(blob, name);
}

function text(x, y, s, cls) {
  const t = document.createElementNS(SVG, "text");
  t.setAttribute("x", x); t.setAttribute("y", y); t.setAttribute("class", cls);
  t.textContent = s;
  return t;
}

function download(blob, name) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

// ファイル名に使えない文字を除く
const fileName = (s) => s.replace(/[\\/:*?"<>|\s]+/g, "_").slice(0, 40);

const clamp = (n) => Math.max(-100, Math.min(100, n));

// 位置を「チームで寄り（強め）・挑戦寄り（弱め）」のような言葉にする（指で点が隠れても確かめられるように）
function describe(p, meta) {
  const part = (v, neg, posi) => {
    if (v === 0) return null;
    const a = Math.abs(v);
    return `${v > 0 ? posi : neg}寄り（${a <= 33 ? "弱め" : a <= 66 ? "中くらい" : "強め"}）`;
  };
  const parts = [part(p.x, meta.xl, meta.xr), part(p.y, meta.yb, meta.yt)].filter(Boolean);
  return parts.length ? parts.join("・") : "ちょうど真ん中";
}

function line(x1, y1, x2, y2) {
  const l = document.createElementNS(SVG, "line");
  l.setAttribute("x1", x1); l.setAttribute("y1", y1);
  l.setAttribute("x2", x2); l.setAttribute("y2", y2);
  l.setAttribute("class", "guide");
  return l;
}

// ヒートマップの濃さ（5段階）。凡例でも同じ値を使う
const HEAT_STEPS = [.12, .27, .44, .62, .82];

// 票の集まり具合を、マップを10px角のマスに区切って計算し、濃淡のマスとして返す
// 1票ごとになだらかな山（ガウス分布）を置いて足し合わせ、いちばん高いところを最も濃くする
function heatCells(list) {
  if (!list.length) return [];
  const size = 10, n = 400 / size, sigma = 15; // sigma は票の単位（-100〜100）での広がり
  const grid = [];
  let max = 0;
  for (let r = 0; r < n; r++) {
    for (let c = 0; c < n; c++) {
      const x = ((c + .5) * size - 200) / 1.8, y = (200 - (r + .5) * size) / 1.8;
      let d = 0;
      for (const v of list) d += Math.exp(-((v.x - x) ** 2 + (v.y - y) ** 2) / (2 * sigma * sigma));
      grid.push(d);
      if (d > max) max = d;
    }
  }
  const cells = [];
  grid.forEach((d, i) => {
    const level = Math.ceil(d / max * HEAT_STEPS.length) - 1;
    if (d / max < .08) return; // ほとんど票のないところは塗らない
    const rect = document.createElementNS(SVG, "rect");
    rect.setAttribute("x", (i % n) * size); rect.setAttribute("y", Math.floor(i / n) * size);
    rect.setAttribute("width", size); rect.setAttribute("height", size);
    rect.setAttribute("class", "heat");
    rect.setAttribute("fill-opacity", HEAT_STEPS[level]);
    cells.push(rect);
  });
  return cells;
}

function valid(v) {
  return v && typeof v.x === "number" && typeof v.y === "number"
    && Math.abs(v.x) <= 100 && Math.abs(v.y) <= 100;
}

// 点と、名前があればラベルをまとめた g を返す（右寄りの点はラベルを左側に出して、はみ出さないようにする）
function dot(x, y, isMine, name) {
  const cx = 200 + x * 1.8, cy = 200 - y * 1.8;
  const g = document.createElementNS(SVG, "g");
  g.setAttribute("class", "pt");
  const c = document.createElementNS(SVG, "circle");
  c.setAttribute("cx", cx);
  c.setAttribute("cy", cy);
  c.setAttribute("r", isMine ? 11 : 7);
  c.setAttribute("class", isMine ? "me" : "v");
  g.append(c);
  if (typeof name !== "string" || !name) return g;
  const t = document.createElementNS(SVG, "text");
  const left = x > 40;
  t.setAttribute("x", left ? cx - 12 : cx + 12);
  t.setAttribute("y", cy);
  t.setAttribute("text-anchor", left ? "end" : "start");
  t.setAttribute("class", isMine ? "nm mine" : "nm");
  t.textContent = name;
  g.append(t);
  return g;
}

function loadMine(key) {
  try {
    const m = JSON.parse(localStorage.getItem(key));
    return m && typeof m.id === "string" && valid(m) ? m : null;
  } catch (e) { return null; }
}
